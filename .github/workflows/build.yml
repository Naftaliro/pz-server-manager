name: build

# Every release is built here from the public source, so the signed files can be traced
# back to a commit (SignPath origin verification). Pushing a v* tag makes a draft release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build installer and zip
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v6
        with:
          name: knox-launcher-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: knox-launcher-windows
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Knox Launcher is a Windows app for hosting Project Zomboid servers and joining friends' servers with the same mods. The [README](https://github.com/${{ github.repository }}#readme) covers everything it does.

          Download `Knox-Launcher-Setup-*.exe` to install, or the `-win.zip` for the portable version.

          Built by GitHub Actions from this tag. Free code signing provided by SignPath.io, certificate by SignPath Foundation. See the [Code signing policy](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING_POLICY.md).
          NOTES
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            --draft
