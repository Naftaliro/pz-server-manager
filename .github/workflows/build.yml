name: build

# Every release is built and signed here from the public source, so the signed files can be
# traced back to a commit. Pushing a v* tag makes a draft release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Only tag builds and manual runs are signed. Everything else, pull requests included,
      # builds unsigned and never gets the Azure secrets.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      # Actions are pinned to a commit (a tag can be moved to other code), the version is in the comment.
      # The build never pushes, so the token isn't left in .git/config for the later steps
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build installer and zip
        if: env.SIGN != 'true'
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The signing options are added here instead of package.json, so local builds and
      # pull requests still build without Azure.
      - name: Build and sign installer and zip
        if: env.SIGN == 'true'
        shell: bash
        run: |
          npm pkg set "build.win.azureSignOptions.publisherName=Mitchell Berg" \
            build.win.azureSignOptions.endpoint=https://eus.codesigning.azure.net \
            build.win.azureSignOptions.codeSigningAccountName=knoxlauncher \
            build.win.azureSignOptions.certificateProfileName=knoxlauncher
          npm run build:win -- --publish never
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # The certificates only last 3 days, so every signature needs a timestamp to stay valid.
      # Same checks as the app's updater (signedByUs in electron/ipc/winScripts.ts)
      - name: Check signatures
        if: env.SIGN == 'true'
        run: |
          foreach ($f in Get-ChildItem release/*.exe, release/win-unpacked/*.exe) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            $cert = $sig.SignerCertificate
            $signer = $cert.Subject
            $issuer = $cert.GetNameInfo('SimpleName', $true)
            $eku = @($cert.Extensions | Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } | ForEach-Object { $_.EnhancedKeyUsages } | ForEach-Object { $_.Value })
            "$($f.Name): $($sig.Status), $signer, issuer: $issuer, timestamped: $($null -ne $sig.TimeStamperCertificate), eku: $($eku -join ' ')"
            if ($sig.Status -ne 'Valid' -or $signer -notmatch '(^|, )CN=Mitchell Berg(,|$)' -or $signer -notmatch '(^|, )O=Mitchell Berg(,|$)' -or
                -not $issuer.StartsWith('Microsoft ID Verified CS ') -or $eku -notcontains '1.3.6.1.4.1.311.97.1.0' -or $null -eq $sig.TimeStamperCertificate) {
              throw "$($f.Name) isn't signed and timestamped by Mitchell Berg through Artifact Signing"
            }
          }

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: knox-launcher-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: knox-launcher-windows
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Knox Launcher is a Windows app for hosting Project Zomboid servers and joining friends' servers with the same mods. The [README](https://github.com/${{ github.repository }}#readme) covers everything it does.

          Download `Knox-Launcher-Setup-*.exe` to install, or the `-win.zip` for the portable version.

          Built by GitHub Actions from this tag and signed with Microsoft Artifact Signing. See the [Code signing policy](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING_POLICY.md).
          NOTES
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            --draft
